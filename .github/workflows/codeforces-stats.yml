name: Update Codeforces Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Codeforces stats
        id: cf
        run: |
          python <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          HANDLE = "jishaan123465"

          def fetch(url):
              with urllib.request.urlopen(url) as response:
                  data = json.load(response)

              if data["status"] != "OK":
                  raise RuntimeError(
                      data.get("comment", "Codeforces API request failed")
                  )

              return data["result"]

          user = fetch(
              f"https://codeforces.com/api/user.info?handles={HANDLE}"
          )[0]

          rating = user["rating"]
          max_rating = user["maxRating"]
          rank = user["rank"].title()

          submissions = []
          start = 1
          batch_size = 10000

          while True:
              batch = fetch(
                  f"https://codeforces.com/api/user.status"
                  f"?handle={HANDLE}&from={start}&count={batch_size}"
              )

              submissions.extend(batch)

              if len(batch) < batch_size:
                  break

              start += batch_size
              time.sleep(2.2)

          solved_problems = set()
          submission_days = set()

          for submission in submissions:
              if submission.get("verdict") == "OK":
                  timestamp = submission.get("creationTimeSeconds")

                  if timestamp:
                      day = datetime.fromtimestamp(
                          timestamp, tz=timezone.utc
                      ).date()
                      submission_days.add(day)

                  problem = submission.get("problem", {})
                  contest_id = problem.get("contestId")
                  index = problem.get("index")

                  if contest_id is not None and index:
                      solved_problems.add((contest_id, index))

          max_streak = 0
          current_streak = 0
          previous_day = None

          for day in sorted(submission_days):
              if previous_day is None:
                  current_streak = 1
              elif (day - previous_day).days == 1:
                  current_streak += 1
              else:
                  current_streak = 1

              max_streak = max(max_streak, current_streak)
              previous_day = day

          solved = len(solved_problems)

          print(f"Current Rating: {rating}")
          print(f"Max Rating: {max_rating}")
          print(f"Rank: {rank}")
          print(f"Problems Solved: {solved}")
          print(f"Max Streak: {max_streak} days")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"rating={rating}\n")
              f.write(f"max_rating={max_rating}\n")
              f.write(f"rank={rank}\n")
              f.write(f"solved={solved}\n")
              f.write(f"streak={max_streak}\n")
          PY

      - name: Update README
        env:
          RATING: ${{ steps.cf.outputs.rating }}
          MAX_RATING: ${{ steps.cf.outputs.max_rating }}
          RANK: ${{ steps.cf.outputs.rank }}
          SOLVED: ${{ steps.cf.outputs.solved }}
          STREAK: ${{ steps.cf.outputs.streak }}
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          # Count all Java solutions in the repository
          java_files = list(Path(".").rglob("*.java"))
          total_solutions = len(java_files)

          # Update total repository count
          text = re.sub(
              r'- \*\*\d+\*\* Java solutions tracked in this repository',
              f'- **{total_solutions}** Java solutions tracked in this repository',
              text
          )

          # Update topic counts based on actual folders
          topic_pattern = re.compile(
              r'(\| \d{2} \| \[.*?\]\(\./([^)]*)\) \| )\d+( \|)'
          )

          def update_topic(match):
              prefix = match.group(1)
              folder = match.group(2)
              suffix = match.group(3)

              folder_path = Path(folder)

              if folder_path.exists():
                  count = len(list(folder_path.rglob("*.java")))
              else:
                  count = 0

              return f"{prefix}{count}{suffix}"

          text = topic_pattern.sub(update_topic, text)

          # Update Codeforces profile stats
          replacements = {
              r'\| Current Rating \|.*\|':
                  f'| Current Rating | {os.environ["RATING"]} |',

              r'\| Max Rating \|.*\|':
                  f'| Max Rating | {os.environ["MAX_RATING"]} |',

              r'\| Rank \|.*\|':
                  f'| Rank | {os.environ["RANK"]} |',

              r'\| Problems Solved \|.*\|':
                  f'| Problems Solved | {os.environ["SOLVED"]} |',

              r'\| Max Streak \|.*\|':
                  f'| Max Streak | {os.environ["STREAK"]} days |',
          }

          for pattern, replacement in replacements.items():
              text = re.sub(pattern, replacement, text)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Create stats pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update Codeforces stats"
          title: "Update Codeforces stats"
          body: |
            Automatically updated repository and Codeforces statistics.
          branch: update-codeforces-stats
          delete-branch: true